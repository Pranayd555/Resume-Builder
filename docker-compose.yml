# Local development: run the API in the same container image as production,
# against a throwaway local MongoDB (never your Atlas database).
#
#   docker compose up --build        # API on http://localhost:5000
#   cd resume-builder && npm start   # frontend on http://localhost:3000
#
# Settings come from backend/.env (copy backend/env.template); MONGODB_URI and
# CLIENT_URL are overridden below. Production uses deploy/docker-compose.yml.
name: presmistique-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    init: true
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/resumebuilder
      CLIENT_URL: http://localhost:3000
    ports:
      - "127.0.0.1:5000:5000"
    shm_size: "512mb"
    depends_on:
      - mongo

volumes:
  mongo-data:
