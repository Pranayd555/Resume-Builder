# SonarCloud automatic analysis reads this file (not sonar-project.properties,
# which only applies to CI-based scanner runs). Keep the two exclusion lists in sync.
#
# Operator-run scripts (backend/scripts, scripts/) are excluded: they take their
# input from the command line and environment of whoever runs them, which the
# taint analysis treats as untrusted user input.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/dist/**,**/scripts/**,**/thumbnails/**,**/uploads/**
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js
sonar.sourceEncoding=UTF-8
